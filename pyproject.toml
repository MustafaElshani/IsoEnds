[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "isoends"
version = "1.0.0"
description = "Companion tool for IsoForge: replicate-aware statistics for poly(A) tail length, alternative polyadenylation and transcription start sites"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mustafa Elshani" }]
keywords = ["nanopore", "long-read", "RNA-seq", "poly(A)", "alternative polyadenylation", "transcription start site",
            "isoforge"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "scipy>=1.11",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
bam = ["pysam>=0.22"]
test = ["pytest>=8", "statsmodels>=0.14"]

[project.urls]
Homepage = "https://github.com/MustafaElshani/IsoEnds"
Issues = "https://github.com/MustafaElshani/IsoEnds/issues"

[project.scripts]
isoends = "isoends.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isoends = ["R/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
